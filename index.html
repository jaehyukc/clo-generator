<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강의계획서 기반 AI CLO 추천 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-6">
  <div class="max-w-4xl mx-auto space-y-6">
    <header class="border-b pb-4">
      <h1 class="text-2xl font-bold text-indigo-700">🎓 성과기반 교육(OBE) CLO 자동 추천기</h1>
      <p class="text-slate-600 text-sm mt-1">강의계획서나 수업자료를 입력하면 Bloom의 인지 단계에 맞춘 측정 가능한 CLO 문장을 생성합니다.</p>
    </header>

    <!-- 설정 영역 -->
    <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-200 space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-1">Google Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="AI Studio에서 발급받은 API Key 입력" class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-1">학년 / 위계 수준</label>
          <select id="gradeLevel" class="w-full p-2 border rounded text-sm">
            <option value="기초 (1~2학년) - Remember/Understand">기초 (1~2학년 - 기억/이해/적용)</option>
            <option value="중급 (2~3학년) - Apply/Analyze" selected>중급 (2~3학년 - 적용/분석)</option>
            <option value="심화 (3~4학년) - Evaluate/Create">심화 (3~4학년 - 평가/창안/캡스톤)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">연계 핵심역량 선택 (인천대 6C 예시)</label>
          <select id="competency" class="w-full p-2 border rounded text-sm">
            <option value="지식탐구 (AI 활용 정보탐색·비판적 분석)">지식탐구 (AI 정보탐색·비판적 분석)</option>
            <option value="의사소통 (AI 기반 정보해석·의사소통)">의사소통 (AI 정보해석·발표)</option>
            <option value="문제해결 (AI 활용 문제분석·해결)">문제해결 (AI 문제진단·해결)</option>
            <option value="창의융합">창의융합</option>
            <option value="협업인성 (인간-AI 협업 및 책임)">협업인성 (인간-AI 협업)</option>
            <option value="도전창조">도전창조</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">강의계획서 / 수업 목표 및 개요</label>
        <textarea id="syllabusText" rows="6" placeholder="강의계획서의 교과목 개요, 수업목표, 주차별 내용 등을 복사하여 붙여넣으세요..." class="w-full p-3 border rounded text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
      </div>

      <button onclick="generateCLO()" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded transition">
        CLO 문장 추천받기
      </button>
    </div>

    <!-- 결과 출력 영역 -->
    <div id="resultContainer" class="hidden space-y-4">
      <h2 class="text-xl font-bold text-slate-800">✨ 추천 교과목 학습성과(CLO) 목록</h2>
      <div id="cloList" class="space-y-3"></div>
    </div>
  </div>

  <script>
    async function generateCLO() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const syllabus = document.getElementById('syllabusText').value.trim();
      const gradeLevel = document.getElementById('gradeLevel').value;
      const competency = document.getElementById('competency').value;
      const btn = document.getElementById('submitBtn');

      if (!apiKey) return alert('Gemini API Key를 입력해주세요.');
      if (!syllabus) return alert('강의계획서 내용을 입력해주세요.');

      btn.disabled = true;
      btn.innerText = 'AI 분석 및 CLO 문장 생성 중...';

      const prompt = `
당신은 성과기반 교육(OBE) 전문가입니다. 제공된 강의계획서를 바탕으로 3~4개의 측정 가능한 교과목 학습성과(CLO)를 작성해주세요.

[조건]
- 위계 수준: ${gradeLevel}
- 주 연계 핵심역량: ${competency}
- 작성 지침:
  1. '이해한다', '알고 있다' 등 추상적 표현 배제 [7, 8]. 측정 가능한 행동 동사(~를 분석한다, ~를 작성한다, ~를 설계한다) 중심 완성형 문장 작성 [4, 7, 10].
  2. 문장 구조: "[조건/도구]를 활용하여 [내용]을 [행동동사]할 수 있다." [9, 10]

[강의계획서 내용]
${syllabus}

[응답 형식] 반드시 순수한 JSON 배열만 반환하세요. 다른 텍스트는 포함하지 마세요.
[
  {
    "id": "CLO 1",
    "statement": "생성된 CLO 완성형 문장",
    "bloom": "Bloom 인지 단계 (예: 분석)",
    "competency": "연계 역량",
    "assessment": "추천 평가 방법 (예: 루브릭 평가, 과제)"
  }
]
      `;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        const rawText = data.candidates.content.parts.text;
        const cleanJson = rawText.replace(/```json|```/g, '').trim();
        const clos = JSON.parse(cleanJson);

        displayResults(clos);
      } catch (err) {
        alert('CLO 생성 중 오류가 발생했습니다. API Key와 입력 내용을 확인해주세요.');
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.innerText = 'CLO 문장 추천받기';
      }
    }

    function displayResults(clos) {
      const container = document.getElementById('resultContainer');
      const list = document.getElementById('cloList');
      list.innerHTML = '';

      clos.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-white p-4 rounded-lg border border-slate-200 shadow-sm space-y-2';
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="font-bold text-indigo-600">${item.id}</span>
            <span class="text-xs bg-indigo-50 text-indigo-700 px-2 py-1 rounded font-medium">Bloom: ${item.bloom}</span>
          </div>
          <p class="text-slate-800 font-medium">${item.statement}</p>
          <div class="text-xs text-slate-500 flex gap-4 pt-2 border-t">
            <span>🎯 역량: ${item.competency}</span>
            <span>📝 평가 도구: ${item.assessment}</span>
          </div>
        `;
        list.appendChild(card);
      });

      container.classList.remove('hidden');
    }
  </script>
</body>
</html>
